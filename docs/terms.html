# TechBench — Terms of Service & Acceptable Use Policy

**Version:** v2
**Effective date:** 2026-09-04
**Takedown / DMCA contact:** **donzdani60@gmail.com**

By accessing or uploading content to TechBench you ("the User") agree to these terms.

---

## 1. The Service

TechBench is a technician's reference platform for electronic-device repair. It
provides:

- A **public reference library** of board photos, schematics, boardviews, and
  reference diagrams, all of which are either created in-house or licensed
  under a recognised open licence (Creative Commons CC BY / CC BY-SA /
  CC BY-NC / CC BY-NC-SA, or public domain).
- A **private per-user library** ("Bring Your Own Data") into which signed-in
  users may upload files for their own personal-use reference. Files in the
  private library are stored against the user's account and are **not visible
  to other users or to the general public**.

**Free trial & accounts.** You may explore TechBench and use its AI-powered
features (board scanning, AI diagnostics, and the Copilot assistant) a limited
number of times without an account. After the free trial is used up, you must
create a free TechBench account to continue using the AI features. Some
features may in future require a paid subscription ("Pro"). Your use of the
service is also governed by our **Privacy Policy**.

## 2. Public library — licensing & attribution

Every file in the public library carries a licence code, attribution text,
and attribution link. The TechBench UI displays the attribution alongside the
file. Users who download or re-share a public-library file must comply with
the file's licence (typically: keep the credit, link back, no commercial use,
share-alike).

We do **not** publish proprietary, copyrighted, or paid-tool exports
(including but not limited to ZXW, Wuxinji, JCID, Phoneboard) in the public
library.

## 3. Private library — Bring Your Own Data ("BYOD")

Signed-in users may upload files to a private storage area scoped to their
account. By uploading, the user **represents and warrants** that one of the
following is true:

1. The user is the original author / copyright holder of the file; or
2. The file is licensed under a recognised open licence and the user is
   complying with that licence; or
3. The file is held for the user's own **personal-use reference only** under a
   licence that permits personal storage (e.g. a paid ZXW / Wuxinji
   subscription seat).

Private files are stored under the user's account in a private storage
bucket and are not served to other users, are not indexed publicly, and are
not part of the public library.

## 4. Prohibited uploads

You **may not** upload, share, or otherwise transmit through TechBench any
content that:

- Infringes the copyright, trademark, trade-secret, or other intellectual
  property rights of any third party;
- Contains malware, exploits, or executable payloads;
- Violates the law of your jurisdiction or the jurisdiction in which our
  servers are hosted;
- Is intended to harass, defame, or harm any person or business.

## 5. Repeat-infringer policy

We will terminate the account of any user who, in our reasonable judgement,
is a repeat infringer of intellectual-property rights.

## 6. Takedown procedure (DMCA-style)

If you believe content on TechBench infringes your copyright, send a written
notice to **donzdani60@gmail.com** containing:

1. Your physical or electronic signature.
2. Identification of the copyrighted work claimed to be infringed.
3. The URL or sufficient detail to locate the material on TechBench.
4. Your contact information (address, telephone, email).
5. A statement that you have a good-faith belief that the use is not
   authorised.
6. A statement, under penalty of perjury, that the information in the notice
   is accurate and that you are authorised to act on behalf of the rights
   holder.

We aim to respond within **72 hours** and to remove or disable access to
verified-infringing content within **24 hours** of receiving a complete and
valid notice.

## 7. AI output, no warranty & limitation of liability

**AI-generated content.** Diagnoses, golden values, suggested measurements,
heat-map data, and Copilot answers are produced in whole or in part by
artificial-intelligence systems. AI output **can be wrong**, incomplete, or
unsafe for your specific board revision. It is reference information for
trained technicians — it is **not** professional advice, and it must be
independently verified against official documentation before acting on it.

**Electrical safety.** Working on electronic devices involves inherent risks,
including short circuits, component damage, fire, and injury. You are solely
responsible for following safe bench practice (disconnecting power before
probing, ESD protection, current-limited supplies). Never rely on the app as
your only safety check.

**No warranty.** TechBench is provided **"as is"** and "as available",
without warranty of any kind. The accuracy of board photos, schematics,
golden values, live measurements, and heat-map data is not guaranteed.
Repair work is performed entirely at your own risk.

**Limitation of liability.** To the maximum extent permitted by law,

## 8. Account, subscriptions & data deletion

**Free trial.** New users receive a limited number of free AI actions, shared
across board scanning, AI diagnostics, and the Copilot assistant. Once the
trial is used up, a free account is required to continue using the AI features.

**Subscriptions.** Paid "Pro" plans, where offered, are billed through the app
store or payment processor disclosed at the point of purchase. Prices, renewal
terms, and cancellation options are shown before you subscribe, and store

**Deleting your data.** You may delete any file from your private library at

emailing **donzdani60@gmail.com** with the subject "Account deletion" from the
email address registered to your account. Account deletion is irreversible.
