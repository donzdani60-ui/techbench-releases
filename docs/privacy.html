# TechBench — Privacy Policy

**Version:** v2
**Effective date:** 2026-09-04
**Contact:** **donzdani60@gmail.com**

This Privacy Policy explains what data TechBench ("we", "the app") collects,
why we collect it, and the choices you have. It should be read together with
our **Terms of Service**.

---

## 1. Summary

- We collect the minimum needed to run the app: an account identifier, your
  usage counters, and any files you choose to upload to your private library.
- We do **not** sell your personal data.
- Board photos you scan are sent to our diagnostic backend and to our AI
  providers only to produce a diagnosis, and are not published.
- You can delete your account and data at any time (see §7).

## 2. Who we are

TechBench is a technician's reference and diagnostic tool for electronic-device
repair. The data controller for the purposes of this policy can be reached at
**donzdani60@gmail.com**.

## 3. What we collect

**Account data.** When you first open the app you are given an anonymous
session. If you create an account, we store your email address and an
authentication record (handled by our authentication provider, Supabase). We
never see or store your password in plain text.

**Usage data.** We store how many free AI actions you have used and your plan
status (free / Pro), so we can apply the free trial and any subscription
entitlements.

**Content you provide.**
- *Board scans:* images you capture with the scanner are sent to our backend
  and to our AI providers (Google Gemini and/or Anthropic Claude) to generate
  a diagnosis. Scan images are processed to produce a result; we do not add
  them to the public library.
- *Private library uploads:* files you upload ("Bring Your Own Data") are
  stored privately against your account and are not shared with other users.
- *Copilot messages:* the text you send to the Copilot, plus relevant device
  context, is sent to our AI providers to generate a reply.
- *Voice input:* when you use the microphone, speech is converted to text on
  your device (or by your operating system's speech service); only the
  resulting text is sent to our AI providers. We do not store audio
  recordings.
- *Diagnostic streams:* if you request an analysis while a device is
  connected, the relevant diagnostic data — UART/serial console lines,
  power-meter readings (voltage/current), and device hardware identifiers —
  is included with that request so the AI can analyze it.
- *Repair records & annotations:* data you enter (repair logs, readings,
  annotations) is stored against your account.

**Device & diagnostic data.** When you connect a device over USB, we read
non-personal hardware identifiers (model, serial, board number) to select the
correct schematic and golden values.

**Locally-stored settings.** Preferences such as calibration and display
options are stored **only on your device** and are never sent to our
servers.

## 4. How we use your data

- To provide the diagnostic and reference features you request.
- To enforce the free trial and manage subscription entitlements.
- To keep your private library and repair history available across your
  devices when you are signed in.
- To respond to support and legal (takedown) requests.

We do **not** use your data for third-party advertising and we do **not** sell
it.

## 5. Third-party processors

We share data only with the service providers needed to run the app:

- **Supabase** — authentication, database, and file storage (your account,
  usage counters, private library, repair records).
- **Google (Gemini)** and **Anthropic (Claude)** — AI analysis of board
  scans, diagnostic data, and Copilot messages.
- **Render** — hosting for our backend API.
- **App store / payment processor** — if you purchase a subscription, billing
  is handled by the store; we receive only the entitlement status.

Each processor handles data under its own privacy terms.

## 5a. International transfers

We operate from the United Kingdom. Our processors (Supabase, Google,
Anthropic, Render) may process data on servers outside the UK/EEA, including
in the United States, under their own safeguards (such as standard
contractual clauses). By using the AI features you acknowledge this transfer.

## 6. Data retention

We keep your account data and content for as long as your account exists. When
you delete your account (see §7), your associated records are removed from our
active databases. Backups are rotated on a rolling basis.

## 7. Your rights & choices

- **Access / export:** email us to request a copy of your data.
- **Deletion:** delete individual files from *My Library* at any time, or
  delete your entire account and data in-app from
  **Settings → Account → Delete account**. You may also email
  **donzdani60@gmail.com** with the subject "Account deletion". Deletion is
  irreversible.
- **Stay anonymous:** you may use the free trial without creating an account.
- **UK/EU users:** you additionally have the rights provided by the UK GDPR /
  GDPR (rectification, restriction, objection, portability, and the right to
  complain to the ICO or your local supervisory authority).

## 8. Children

TechBench is a professional repair tool and is not directed at children under
13 (or the minimum age of digital consent in your jurisdiction). We do not
knowingly collect data from children.

## 9. Security

Data in transit is encrypted with TLS. Authentication and storage are handled
by Supabase with row-level security so users can only access their own private
data. No system is perfectly secure; use the app at your own risk.

## 10. Changes to this policy

We may update this policy. Material changes will be surfaced in-app with a new
acceptance prompt before continued use is permitted.

## 11. Contact

Questions, data requests, and complaints: **donzdani60@gmail.com**
